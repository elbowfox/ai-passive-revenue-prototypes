<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ContentRepurposer - AI Content Multiplier</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }
    textarea { width: 100%; height: 150px; margin: 10px 0; }
    button { padding: 10px 20px; margin: 5px; background: #111; color: white; border: none; cursor: pointer; }
    .output { background: #f5f5f5; padding: 15px; margin: 10px 0; white-space: pre-wrap; border-radius: 8px; }
    input { width: 100%; padding: 8px; margin: 5px 0; }
  </style>
</head>
<body>
  <h1>ContentRepurposer</h1>
  <p>Paste long content → get Twitter threads, LinkedIn posts, email versions, and summaries. AI-powered.</p>
  
  <label>API Key (OpenAI or compatible, stored only in your browser):</label>
  <input type="password" id="apiKey" placeholder="sk-...">
  
  <label>Model endpoint (default OpenAI):</label>
  <input id="endpoint" value="https://api.openai.com/v1/chat/completions">
  
  <label>Content to repurpose:</label>
  <textarea id="content" placeholder="Paste blog post, transcript, article..."></textarea>
  
  <button onclick="generate()">Generate All Formats</button>
  
  <div id="outputs"></div>

  <script>
    async function generate() {
      const key = document.getElementById('apiKey').value;
      const endpoint = document.getElementById('endpoint').value;
      const content = document.getElementById('content').value;
      if (!key || !content) { alert('Need API key and content'); return; }
      
      const formats = [
        { name: 'Twitter Thread', prompt: 'Turn this into a 5-8 tweet thread with hooks and value. Use numbered tweets.' },
        { name: 'LinkedIn Post', prompt: 'Write a professional LinkedIn post (150-300 words) with insights and a call to action.' },
        { name: 'Email Newsletter', prompt: 'Create a short email newsletter version with subject line and body.' },
        { name: 'Summary', prompt: 'Provide a concise 3-bullet summary of the key points.' }
      ];
      
      document.getElementById('outputs').innerHTML = '<p>Generating...</p>';
      let html = '';
      
      for (const f of formats) {
        try {
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
            body: JSON.stringify({
              model: 'gpt-4o-mini',
              messages: [{ role: 'user', content: f.prompt + '\n\nContent:\n' + content }],
              max_tokens: 500
            })
          });
          const data = await res.json();
          const text = data.choices?.[0]?.message?.content || JSON.stringify(data);
          html += `<h3>${f.name}</h3><div class="output">${text}</div>`;
        } catch (e) {
          html += `<h3>${f.name}</h3><div class="output">Error: ${e.message}</div>`;
        }
      }
      document.getElementById('outputs').innerHTML = html;
    }
  </script>
</body>
</html>
